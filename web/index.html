<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sfos-topology — Fleet graph</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="graph-page">

  <header class="g-header">
    <span class="brand">sfos-topology</span>
    <span class="crumb">/</span>
    <span class="view-name">Fleet graph</span>

    <form class="g-lookup" id="lookupForm">
      <div class="field">
        <label class="eyebrow" for="lookupInput">Lookup</label>
        <input type="text" id="lookupInput" placeholder="10.20.0.42" autocomplete="off" inputmode="decimal">
      </div>
      <button type="submit">Resolve</button>
    </form>

    <span class="g-spacer"></span>
    <span class="freshness" id="freshness">Collecting…</span>
    <button type="button" class="outline" id="fleetBtn" hidden>Fleet</button>
    <button type="button" class="outline" id="exportSvg">Export SVG</button>
  </header>

  <div class="g-toolbar">
    <div class="seg" id="projectionSeg" role="group" aria-label="Projection">
      <button type="button" data-value="underlay" aria-pressed="true">Underlay</button>
      <button type="button" data-value="overlay" aria-pressed="false">Overlay</button>
    </div>

    <div class="divider"></div>
    <span class="eyebrow">Confidence</span>
    <div class="seg" id="confidenceSeg" role="group" aria-label="Confidence filter">
      <button type="button" data-value="all" aria-pressed="true">All</button>
      <button type="button" data-value="confirmed" aria-pressed="false">Confirmed</button>
      <button type="button" data-value="inferred" aria-pressed="false">Inferred</button>
      <button type="button" data-value="assumed" aria-pressed="false">Assumed</button>
    </div>

    <div class="divider"></div>
    <label class="check"><input type="checkbox" id="mgmtToggle"> Management interfaces</label>

    <span class="g-spacer"></span>
    <span class="counts" id="counts">— nodes · — edges · — warnings</span>
  </div>

  <div id="stale" class="stale-banner" hidden></div>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner"></div>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
    <aside class="drawer" id="drawer" aria-label="Inspector">
      <div class="drawer-head" id="drawerHead"></div>
      <div class="drawer-tabs" id="drawerTabs" role="tablist">
        <button type="button" role="tab">Overview</button>
        <button type="button" role="tab">Evidence</button>
        <button type="button" role="tab">Warnings</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot">
        <span>Read-only view · no write endpoint is reachable from here</span>
        <button type="button" class="ghost" id="copyJson">Copy as JSON</button>
      </div>
      <button type="button" class="icon-btn" id="drawerClose" aria-label="Close inspector" style="position:absolute;top:12px;right:12px">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </aside>
  </div>

  <div class="g-legend">
    <span><span class="ex" style="border-bottom:2px solid rgba(0,26,71,.42)">&nbsp;</span>Confirmed</span>
    <span><span class="ex" style="border-bottom:2px dashed var(--blue)">&nbsp;</span>Inferred</span>
    <span><span class="ex" style="border-bottom:2px dotted var(--slate)">&nbsp;</span>Assumed</span>
    <span><span class="ex" style="border-bottom:2px dashed #00A6C7">&nbsp;</span>VPN tunnel</span>
    <span class="g-spacer"></span>
    <span>Every edge carries its rule — click a tag to read the configuration behind it</span>
    <span style="margin-left:auto">Configuration only · no live traffic</span>
  </div>

</div>
<script type="module" src="/graph.js"></script>
</body>
</html>
