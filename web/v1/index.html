<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewall topology</title>
<style>
  :root {
    color-scheme: light dark;

    --paper:       #eef1f5;
    --paper-line:  #dde3ea;
    --surface:     #ffffff;
    --surface-2:   #f3f5f8;
    --ink:         #16222c;
    --ink-soft:    #5b6b78;
    --ink-faint:   #97a4ae;
    --border:      #dde3ea;

    --north:       #bf640f;
    --north-wash:  #faead9;
    --south:       #0f7490;
    --south-wash:  #e1f0f4;
    --overlay:     #6d4aa8;
    --overlay-wash:#eee8f9;
    --alert:       #bf3a28;

    --shadow-1: 0 1px 2px rgba(20, 30, 40, 0.06);
    --shadow-2: 0 6px 20px rgba(20, 30, 40, 0.10), 0 1px 3px rgba(20, 30, 40, 0.08);

    --r-sm: 6px;
    --r-md: 10px;
    --r-pill: 999px;

    --rule: 1px;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:       #0f151b;
      --paper-line:  #1f2932;
      --surface:     #161e26;
      --surface-2:   #1c252e;
      --ink:         #e8edf1;
      --ink-soft:    #8fa0ac;
      --ink-faint:   #5c6c78;
      --border:      #263039;

      --north:       #e0954e;
      --north-wash:  #2a2015;
      --south:       #52b8d4;
      --south-wash:  #10262c;
      --overlay:     #ab8fe0;
      --overlay-wash:#241d33;
      --alert:       #e2695a;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-2: 0 10px 28px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr 22rem;
    grid-template-areas: "bar bar" "canvas panel";
  }

  /* ---------- top bar ---------- */

  .bar {
    grid-area: bar;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 0.65rem 1.1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    position: relative;
    z-index: 1;
  }

  .bar h1 {
    margin: 0;
    font-family: var(--font-data);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .bar .meta {
    font-family: var(--font-data);
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  .bar .spacer { flex: 1; }

  .controls { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

  .controls label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0.3rem 0.55rem;
    border-radius: var(--r-sm);
    transition: background-color 120ms ease, color 120ms ease;
  }
  .controls label:hover { background: var(--surface-2); color: var(--ink); }

  .controls input[type=checkbox] { accent-color: var(--south); margin: 0; }

  button, .filebtn, a.nav {
    font: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 0.36rem 0.75rem;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }
  a.nav { text-decoration: none; display: inline-block; }

  button:hover, .filebtn:hover, a.nav:hover { background: var(--surface); border-color: var(--ink-faint); box-shadow: var(--shadow-1); }
  button:active, .filebtn:active, a.nav:active { transform: translateY(1px); }
  button:focus-visible, .filebtn:focus-visible, a.nav:focus-visible { outline: 2px solid var(--overlay); outline-offset: 2px; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

  /* ---------- view mode ---------- */

  .modes {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
  }
  .modes .mode-btn {
    background: transparent; border: none; border-radius: calc(var(--r-md) - 3px);
    box-shadow: none;
  }
  .modes .mode-btn[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1);
  }
  .modes .mode-btn:hover { background: var(--surface); box-shadow: none; }
  .modes .mode-btn[aria-pressed="true"]:hover { box-shadow: var(--shadow-1); }

  /* ---------- canvas ---------- */

  .canvas {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px;
  }

  .canvas.dragging { cursor: grabbing; }
  #stage { display: block; width: 100%; height: 100%; }

  .empty {
    position: absolute;
    inset: 0;
    display: none;
    place-content: center;
    text-align: center;
    padding: 2rem;
  }
  .canvas.is-empty .empty { display: grid; }
  .empty p { max-width: 34ch; margin: 0 auto; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.6; }
  .empty code {
    font-family: var(--font-data); font-size: 0.85em; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 0.1em 0.4em;
  }

  .canvas.is-over { outline: 2px dashed var(--south); outline-offset: -8px; }

  /* ---------- graph elements ---------- */

  .node { cursor: pointer; }
  .node-box {
    fill: var(--surface); stroke: var(--ink); stroke-width: var(--rule);
    filter: drop-shadow(0 1px 2px rgba(20, 30, 40, 0.12));
  }
  .node[data-kind="segment"] .node-box { fill: var(--south-wash); }
  .node[data-kind="segment"][data-orientation="north"] .node-box { fill: var(--north-wash); stroke: var(--north); }
  .node[data-kind="cloud"] .node-box { fill: var(--north-wash); stroke: var(--north); }
  .node[data-kind="gateway"] .node-box { fill: none; stroke: var(--ink-soft); stroke-dasharray: 5 3; filter: none; }
  .node[data-kind="device"] .node-box { stroke-width: 2px; }
  .node:not(.dim):hover .node-box { filter: drop-shadow(0 3px 8px rgba(20, 30, 40, 0.2)); }
  .node-dot { fill: var(--ink); stroke: none; }
  .node[data-kind="world"].sel .node-dot { fill: var(--overlay); }
  /* A note is not a fault. Recolouring the box would read as "this device is
     down" to anyone who has looked at a NOC screen, so a caveat gets a mark in
     the corner and the box keeps its normal ink. */
  .node-flag { fill: var(--alert); }
  .node-note { font-family: var(--font-ui); font-size: 9.5px; fill: var(--alert); }
  .node.sel .node-box { stroke: var(--overlay); stroke-width: 2.5px; }
  .node.dim { opacity: 0.3; }

  .node-label { font-family: var(--font-data); font-size: 13px; fill: var(--ink); dominant-baseline: middle; }
  .node-sub { font-family: var(--font-ui); font-size: 10.5px; fill: var(--ink-soft); dominant-baseline: middle; }
  .node-badge { font-family: var(--font-data); font-size: 9.5px; fill: var(--ink-soft); }

  .edge { fill: none; stroke: var(--ink-soft); stroke-width: 1.6px; cursor: pointer; }
  .edge[data-orientation="north"] { stroke: var(--north); }
  .edge[data-orientation="south"] { stroke: var(--south); }
  .edge[data-confidence="inferred"] { stroke-dasharray: 7 4; }
  .edge[data-confidence="assumed"] { stroke-dasharray: 2 4; }
  /* Declared after the confidence rules so a tunnel reads as a tunnel whatever
     its confidence: a VPN link is not a wire and should not look like one. */
  .edge[data-orientation="overlay"] {
    stroke: var(--overlay); stroke-width: 2px; stroke-dasharray: 1.5 5; stroke-linecap: round;
  }
  .edge.sel { stroke: var(--overlay); stroke-width: 3.2px; }
  .edge.dim { opacity: 0.18; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 14px; cursor: pointer; }
  /* :has() lets the hit-area (the wide invisible click target drawn after the
     visible line) drive a hover style on its thin sibling, so the whole link
     reads as interactive without redrawing it wider all the time. */
  g:has(.edge-hit:hover) .edge:not(.sel) { stroke-width: 2.6px; }
  .edge-label {
    font-family: var(--font-data); font-size: 10px; fill: var(--ink-soft);
    paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round;
  }

  /* ---------- inspector ---------- */

  .panel {
    grid-area: panel;
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 1.1rem;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: var(--r-pill); }
  .panel::-webkit-scrollbar-track { background: transparent; }

  .panel h2 {
    margin: 0 0 0.15rem;
    font-family: var(--font-data);
    font-size: 1rem;
    font-weight: 700;
    word-break: break-all;
  }

  .panel .kind { font-size: 0.75rem; color: var(--ink-soft); margin: 0 0 1.1rem; }

  .tabbar { display: flex; gap: 1.3rem; border-bottom: 1px solid var(--border); margin-bottom: 1.1rem; }
  .tab-btn {
    font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft);
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 0 0 0.6rem; margin-bottom: -1px; cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--overlay); }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn:focus-visible { outline: 2px solid var(--overlay); outline-offset: 2px; }
  .tabpanel[hidden] { display: none; }

  .panel section { margin-bottom: 1.3rem; }
  .panel h3 {
    margin: 0 0 0.6rem; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .panel p { margin: 0 0 0.6rem; font-size: 0.82rem; line-height: 1.55; color: var(--ink-soft); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 0.8rem; font-size: 0.8rem; }
  .facts dt { color: var(--ink-soft); }
  .facts dd { margin: 0; font-family: var(--font-data); word-break: break-all; }

  .iface {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 0.55rem 0.7rem; margin-bottom: 0.5rem; font-size: 0.78rem;
  }
  .iface:last-child { margin-bottom: 0; }
  /* Address object names are administrator (or Sophos Central) chosen and
     run long with no spaces to break on, e.g. an auto-generated
     Central_NETWORK_..._<suffix> name -- wrap them rather than overflow
     the panel. */
  .iface .n { font-family: var(--font-data); font-weight: 600; overflow-wrap: anywhere; }
  .iface .a { font-family: var(--font-data); color: var(--ink-soft); overflow-wrap: anywhere; }
  .iface .z { color: var(--ink-soft); margin-top: 0.15rem; }
  .tag {
    display: inline-block; font-size: 0.68rem; padding: 0.05rem 0.45rem;
    border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--ink-soft);
    background: var(--surface);
  }
  .tag.alert { border-color: var(--alert); color: var(--alert); }

  .evidence {
    border-left: 3px solid var(--overlay); background: var(--overlay-wash);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 0.4rem 0.65rem; margin-bottom: 0.6rem;
  }
  .evidence .rule { font-family: var(--font-data); font-size: 0.78rem; color: var(--overlay); }
  .evidence .detail { font-size: 0.8rem; line-height: 1.5; color: var(--ink-soft); }

  .warn {
    border-left: 3px solid var(--alert); background: color-mix(in srgb, var(--alert) 10%, var(--surface));
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 0.4rem 0.65rem; margin-bottom: 0.6rem; font-size: 0.8rem; line-height: 1.5;
  }

  .legend { font-size: 0.75rem; color: var(--ink-soft); line-height: 1.8; }
  .legend .swatch { display: inline-block; width: 1.7rem; border-top-width: 2px; border-top-style: solid; vertical-align: middle; margin-right: 0.4rem; }

  /* ---------- settings modal ---------- */

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 14, 18, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; z-index: 10;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-2);
    width: min(34rem, 100%); max-height: min(38rem, 100%);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.2rem; border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-family: var(--font-data); font-size: 0.95rem; font-weight: 700; }
  .modal-close {
    background: transparent; border: none; padding: 0.2rem 0.5rem; font-size: 0.9rem;
    color: var(--ink-soft); box-shadow: none;
  }
  .modal-close:hover { color: var(--ink); background: var(--surface-2); box-shadow: none; }
  .modal-body { padding: 1.2rem; overflow-y: auto; }
  .modal-body h3 {
    margin: 0 0 0.6rem; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .modal-body .hint { font-size: 0.8rem; line-height: 1.55; color: var(--ink-soft); margin: 0 0 1rem; }

  .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
  .field label { font-size: 0.75rem; color: var(--ink-soft); }
  .field input {
    font: inherit; font-family: var(--font-data); font-size: 0.82rem;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 0.45rem 0.6rem;
  }
  .field input:focus-visible { outline: 2px solid var(--overlay); outline-offset: 1px; }
  .field .note { font-size: 0.72rem; color: var(--ink-faint); }

  .device-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 0.7rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 0.6rem 0.75rem; margin-bottom: 0.5rem;
  }
  .device-row .label { font-family: var(--font-data); font-weight: 600; }
  .device-row .host { font-family: var(--font-data); font-size: 0.78rem; color: var(--ink-soft); }
  .device-row .row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
  .device-row .row-actions button { padding: 0.25rem 0.55rem; font-size: 0.72rem; }

  .form-actions { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .form-actions .primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .form-actions .primary:hover { background: var(--ink); opacity: 0.9; }

  .settings-error {
    border-left: 3px solid var(--alert); background: color-mix(in srgb, var(--alert) 10%, var(--surface));
    border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 0.5rem 0.7rem; margin-bottom: 0.9rem;
    font-size: 0.8rem; line-height: 1.5;
  }
  .settings-note {
    border-left: 3px solid var(--south); background: var(--south-wash);
    border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 0.5rem 0.7rem; margin-bottom: 0.9rem;
    font-size: 0.8rem; line-height: 1.5;
  }

  @media (prefers-reduced-motion: no-preference) {
    .node-box { transition: opacity 120ms linear, filter 120ms ease, stroke-width 120ms ease; }
    .edge { transition: opacity 120ms linear, stroke-width 120ms ease; }
  }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "canvas" "panel"; }
    .panel { border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Firewall topology</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <div class="controls">
    <div class="modes" role="group" aria-label="View">
      <button type="button" class="mode-btn" id="mode-underlay" aria-pressed="true">Underlay</button>
      <button type="button" class="mode-btn" id="mode-overlay" aria-pressed="false">Overlay</button>
    </div>
    <label id="t-overlay-row"><input type="checkbox" id="t-overlay" checked> VPN tunnels</label>
    <label><input type="checkbox" id="t-mgmt"> Management</label>
    <label><input type="checkbox" id="t-ghost" checked> Inferred devices</label>
    <button id="fit">Fit to view</button>
    <button id="export">Save SVG</button>
    <label class="filebtn" tabindex="0">Open graph.json<input type="file" id="file" accept=".json,application/json"></label>
    <a class="nav" href="/v1/policy" title="Design access-control policies between networks">Access policy</a>
    <a class="nav" href="/" title="Try the new interface">Try the new UI &rarr;</a>
    <button id="settings-btn" title="Add, edit or remove firewalls">⚙ Settings</button>
  </div>
</header>

<div class="canvas is-empty" id="canvas">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="empty">
    <p>Drop a <code>graph.json</code> anywhere on this page, or open one from the bar above.
       Generate it with <code>sfos-topology -config devices.json -out graph.json</code>.</p>
  </div>
</div>

<div class="modal-backdrop" id="settings-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="modal-close" id="settings-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="settings-body"></div>
  </div>
</div>

<aside class="panel" id="panel"></aside>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Layout
 *
 * Rank is dictated by orientation, not by graph structure: uplinks sit
 * above the appliance and internal segments below it, which is the whole
 * point of classifying zones in the collector. Within a rank the order is
 * settled by barycentre sweeps, which is enough to keep crossings down at
 * the size a firewall fleet actually reaches.
 * ------------------------------------------------------------------ */

const RANK = { world: -1, cloud: 0, "segment:north": 1, device: 2,
               "segment:south": 3, "segment:management": 3, gateway: 4 };

// The root sits well clear of the first row so it reads as somewhere else
// entirely rather than as another tier of the network.
const WORLD_LIFT = 58;
const WORLD_R = 8;
const ROW_GAP = 130;
const COL_GAP = 34;
const CHAR_W  = 7.9;

function rankOf(n) {
  if (n.kind === "segment") return RANK["segment:" + (n.orientation || "south")] ?? 3;
  return RANK[n.kind] ?? 2;
}

function sizeOf(n) {
  if (n.kind === "world") return { w: WORLD_R * 2, h: WORLD_R * 2 };
  const label = n.label || n.id;
  const sub = n.kind === "device" ? (n.hostname || "") : "";
  const w = Math.max(label.length * CHAR_W, sub.length * 6.2) + 34;
  const h = n.kind === "device" ? 52 : 34;
  return { w: Math.max(w, 96), h };
}

function layout(nodes, edges) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const rows = new Map();

  for (const n of nodes) {
    n._rank = rankOf(n);
    Object.assign(n, sizeOf(n));
    if (!rows.has(n._rank)) rows.set(n._rank, []);
    rows.get(n._rank).push(n);
  }

  // Overlay edges connect peers on the same rank and must not influence
  // vertical ordering, so they are left out of the sweep.
  const structural = edges.filter(e => e.orientation !== "overlay"
    && byId.has(e.from) && byId.has(e.to));
  const neighbours = new Map(nodes.map(n => [n.id, []]));
  for (const e of structural) {
    neighbours.get(e.from).push(e.to);
    neighbours.get(e.to).push(e.from);
  }

  const ranks = [...rows.keys()].sort((a, b) => a - b);
  const indexIn = r => new Map(rows.get(r).map((n, i) => [n.id, i]));

  for (let pass = 0; pass < 6; pass++) {
    const order = pass % 2 ? [...ranks].reverse() : ranks;
    for (const r of order) {
      const fixed = new Map();
      for (const other of ranks) {
        if (other === r) continue;
        for (const [id, i] of indexIn(other)) fixed.set(id, i);
      }
      const row = rows.get(r);
      const bary = new Map();
      row.forEach((n, i) => {
        const vals = neighbours.get(n.id).map(id => fixed.get(id)).filter(v => v !== undefined);
        bary.set(n.id, vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : i);
      });
      row.sort((a, b) => bary.get(a.id) - bary.get(b.id) || a.id.localeCompare(b.id));
    }
  }

  let widest = 0;
  for (const r of ranks) {
    const row = rows.get(r);
    widest = Math.max(widest, row.reduce((s, n) => s + n.w + COL_GAP, -COL_GAP));
  }

  for (const r of ranks) {
    const row = rows.get(r);
    const total = row.reduce((s, n) => s + n.w + COL_GAP, -COL_GAP);
    let x = (widest - total) / 2;
    for (const n of row) {
      n.x = x + n.w / 2;
      n.y = r * ROW_GAP - (n.kind === "world" ? WORLD_LIFT : 0);
      x += n.w + COL_GAP;
    }
  }

  // Bounds come from the boxes actually drawn. Deriving height from the rank
  // count leaves a band of dead space under the last row and throws off the
  // fit, which is very visible once the drawing is exported.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
    y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
  }
  if (!nodes.length) { x0 = y0 = 0; x1 = y1 = 1; }
  return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */

const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
  return e;
};

const stage  = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const panel  = document.getElementById("panel");
const meta   = document.getElementById("meta");

let DOC = null;        // parsed graph.json
let VIEW = { x: 0, y: 0, k: 1 };
let root = null;
let selection = null;

// labelPoint evaluates the curve at its midpoint rather than averaging node
// centres, so the text sits on the line it belongs to.
//
// A same-rank pair is always a VPN tunnel today. In the overlay view WAN
// uplinks are hidden, so the tunnel is drawn north of the device, the same
// side an uplink would occupy; in the underlay view it stays a dip below the
// row, out from under the WAN detail still on screen above it.
function labelPoint(a, b) {
  if (a._rank === b._rank) {
    const north = VIEW_MODE === "overlay";
    const ay = a.y + (north ? -a.h / 2 : a.h / 2), by = b.y + (north ? -b.h / 2 : b.h / 2);
    const dip = (46 + Math.abs(a.x - b.x) * 0.08) * (north ? -1 : 1);
    return { x: (a.x + b.x) / 2, y: (ay + by) / 2 + dip * 0.75 };
  }
  const [top, bot] = a._rank < b._rank ? [a, b] : [b, a];
  return { x: (top.x + bot.x) / 2, y: (top.y + top.h / 2 + bot.y - bot.h / 2) / 2 };
}

function edgePath(a, b) {
  if (a._rank === b._rank) {
    const north = VIEW_MODE === "overlay";
    const dip = (46 + Math.abs(a.x - b.x) * 0.08) * (north ? -1 : 1);
    const ay = a.y + (north ? -a.h / 2 : a.h / 2), by = b.y + (north ? -b.h / 2 : b.h / 2);
    return `M ${a.x} ${ay} C ${a.x} ${ay + dip},` +
           ` ${b.x} ${by + dip}, ${b.x} ${by}`;
  }
  const [top, bot] = a._rank < b._rank ? [a, b] : [b, a];
  const y1 = top.y + top.h / 2, y2 = bot.y - bot.h / 2;
  const m = (y1 + y2) / 2;
  return `M ${top.x} ${y1} C ${top.x} ${m}, ${bot.x} ${m}, ${bot.x} ${y2}`;
}

// VIEW_MODE picks which half of the picture is the point.
//
// "underlay" is the physical fabric: WAN uplinks, clouds and the outer world,
// with the VPN mesh as optional overlay detail (t-overlay). "overlay" inverts
// that: the WAN plumbing that gets a device onto the internet is not what a
// VPN mesh reader wants to see, so it is hidden and the tunnel edges — always
// on in this mode — become the primary connections between appliances.
let VIEW_MODE = "underlay";

function setMode(mode) {
  if (mode === VIEW_MODE) return;
  VIEW_MODE = mode;
  document.getElementById("mode-underlay").setAttribute("aria-pressed", String(mode === "underlay"));
  document.getElementById("mode-overlay").setAttribute("aria-pressed", String(mode === "overlay"));
  document.getElementById("t-overlay-row").hidden = mode === "overlay";
  render();
}

function visible(node) {
  if (!document.getElementById("t-mgmt").checked && node.orientation === "management") return false;
  if (!document.getElementById("t-ghost").checked && node.kind === "gateway") return false;
  if (VIEW_MODE === "overlay") {
    if (node.kind === "world" || node.kind === "cloud") return false;
    if (node.kind === "segment" && node.orientation === "north") return false;
  }
  return true;
}

function render() {
  stage.replaceChildren();
  if (!DOC) { canvas.classList.add("is-empty"); panel.replaceChildren(emptyPanel()); return; }
  canvas.classList.remove("is-empty");

  const showOverlay = VIEW_MODE === "overlay" || document.getElementById("t-overlay").checked;
  const nodes = DOC.graph.nodes.filter(visible);
  const ids = new Set(nodes.map(n => n.id));
  const edges = DOC.graph.edges.filter(e =>
    ids.has(e.from) && ids.has(e.to) && (showOverlay || e.orientation !== "overlay"));

  const box = layout(nodes, edges);
  const byId = new Map(nodes.map(n => [n.id, n]));

  root = el("g");
  const gEdges = el("g"), gNodes = el("g");
  root.append(gEdges, gNodes);
  stage.append(root);

  const placed = [];
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    const d = edgePath(a, b);
    const g = el("g");
    const hit = el("path", { class: "edge-hit", d });
    const line = el("path", {
      class: "edge", d,
      "data-orientation": e.orientation,
      "data-confidence": e.confidence
    });
    e._el = line;
    g.append(line, hit);
    // A link labelled with the name of the node it lands on says nothing
    // twice, so drop it.
    const echoes = e.label && (e.label === a.label || e.label === b.label);
    if (e.label && !echoes) {
      const p = labelPoint(a, b);
      let y = p.y;
      for (let i = 0; i < 4; i++) {
        const clash = placed.some(q => Math.abs(q.x - p.x) < 62 && Math.abs(q.y - y) < 12);
        if (!clash) break;
        y += 14;
      }
      placed.push({ x: p.x, y });
      const t = el("text", { class: "edge-label", x: p.x, y, "text-anchor": "middle" });
      t.textContent = e.label;
      g.append(t);
    }
    const pick = () => select({ type: "edge", data: e });
    hit.addEventListener("click", pick);
    line.addEventListener("click", pick);
    gEdges.append(g);
  }

  for (const n of nodes) {
    const warn = (n.warnings && n.warnings.length) || n.overlappingCidr ? "1" : "0";
    const g = el("g", {
      class: "node", "data-kind": n.kind,
      "data-orientation": n.orientation || "", "data-warn": warn
    });
    n._el = g;
    if (n.kind === "world") {
      // No label: a named box would imply the collector knows something about
      // what is out there, and it knows nothing beyond the next hop.
      g.append(el("circle", { class: "node-dot", cx: n.x, cy: n.y, r: WORLD_R }));
      const title = el("title");
      title.textContent = n.label || "Outer world";
      g.append(title);
      g.addEventListener("click", ev => { ev.stopPropagation(); select({ type: "node", data: n }); });
      gNodes.append(g);
      continue;
    }

    // A network is a round-rectangle so its shape reads as "a network" at a
    // glance, distinct from a device's near-square box; cloud keeps its own,
    // rounder-still treatment as the odd one out (an upstream, not a network).
    const r = n.kind === "cloud" ? 14 : n.kind === "device" ? 3 : 12;
    g.append(el("rect", {
      class: "node-box", x: n.x - n.w / 2, y: n.y - n.h / 2,
      width: n.w, height: n.h, rx: r
    }));

    const hasSub = n.kind === "device" && n.hostname;
    const label = el("text", {
      class: "node-label", x: n.x, y: hasSub ? n.y - 8 : n.y, "text-anchor": "middle"
    });
    label.textContent = n.label || n.id;
    g.append(label);
    if (hasSub) {
      const sub = el("text", { class: "node-sub", x: n.x, y: n.y + 10, "text-anchor": "middle" });
      sub.textContent = n.hostname;
      g.append(sub);
    }
    if (warn === "1") {
      g.append(el("circle", {
        class: "node-flag", cx: n.x + n.w / 2 - 7, cy: n.y - n.h / 2 + 7, r: 3
      }));
    }
    if (n.overlappingCidr) {
      // Below the box, not inside it: the prefix is the label and must stay
      // readable.
      const b = el("text", {
        class: "node-note", x: n.x, y: n.y + n.h / 2 + 12, "text-anchor": "middle"
      });
      b.textContent = "duplicate address";
      g.append(b);
    }
    g.addEventListener("click", ev => { ev.stopPropagation(); select({ type: "node", data: n }); });
    gNodes.append(g);
  }

  fit(box);
  if (selection) reselect();
  else panel.replaceChildren(emptyPanel());
}

/* ---------- pan, zoom, fit ---------- */

let extent = { x: 0, y: 0, width: 1, height: 1 };

function fit(box) {
  extent = box;
  const pad = 70;
  const r = canvas.getBoundingClientRect();
  const k = Math.min((r.width - pad * 2) / Math.max(box.width, 1),
                     (r.height - pad * 2) / Math.max(box.height, 1), 1.4);
  VIEW = {
    k,
    x: (r.width - box.width * k) / 2 - box.x * k,
    y: (r.height - box.height * k) / 2 - box.y * k
  };
  applyView();
}

function applyView() {
  if (root) root.setAttribute("transform", `translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})`);
}

canvas.addEventListener("wheel", ev => {
  if (!root) return;
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const k = Math.min(3, Math.max(0.2, VIEW.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  VIEW.x = px - (px - VIEW.x) * (k / VIEW.k);
  VIEW.y = py - (py - VIEW.y) * (k / VIEW.k);
  VIEW.k = k;
  applyView();
}, { passive: false });

let drag = null;
canvas.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node") || ev.target.closest(".edge-hit")) return;
  drag = { x: ev.clientX - VIEW.x, y: ev.clientY - VIEW.y };
  canvas.classList.add("dragging");
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove", ev => {
  if (!drag) return;
  VIEW.x = ev.clientX - drag.x;
  VIEW.y = ev.clientY - drag.y;
  applyView();
});
const endDrag = () => { drag = null; canvas.classList.remove("dragging"); };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("click", ev => { if (!ev.target.closest(".node, .edge-hit")) select(null); });

/* ---------- selection and inspector ---------- */

function select(sel) {
  selection = sel;
  reselect();
}

function reselect() {
  const nodes = [...stage.querySelectorAll(".node")];
  const edges = [...stage.querySelectorAll(".edge")];
  nodes.forEach(n => n.classList.remove("sel", "dim"));
  edges.forEach(e => e.classList.remove("sel", "dim"));

  if (!selection) { panel.replaceChildren(emptyPanel()); return; }

  if (selection.type === "node") {
    const n = selection.data;
    if (!n._el) { panel.replaceChildren(emptyPanel()); return; }
    n._el.classList.add("sel");
    const touching = new Set();
    for (const e of DOC.graph.edges) {
      if (!e._el) continue;
      if (e.from === n.id || e.to === n.id) { touching.add(e); }
      else e._el.classList.add("dim");
    }
    for (const other of DOC.graph.nodes) {
      if (!other._el || other.id === n.id) continue;
      const linked = [...touching].some(e => e.from === other.id || e.to === other.id);
      if (!linked) other._el.classList.add("dim");
    }
    panel.replaceChildren(nodePanel(n, [...touching]));
  } else {
    const e = selection.data;
    if (e._el) e._el.classList.add("sel");
    edges.forEach(x => { if (x !== e._el) x.classList.add("dim"); });
    nodes.forEach(x => {
      const id = DOC.graph.nodes.find(n => n._el === x)?.id;
      if (id !== e.from && id !== e.to) x.classList.add("dim");
    });
    panel.replaceChildren(edgePanel(e));
  }
}

const h = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function emptyPanel() {
  const f = document.createDocumentFragment();
  f.append(h("h2", null, "Nothing selected"));
  f.append(h("p", "kind", "Pick a node or a link to see where it came from."));

  const s = h("section");
  s.append(h("h3", null, "Reading the drawing"));
  const l = h("div", "legend");
  l.innerHTML =
    '<div><span class="swatch" style="border-color:var(--north)"></span>Uplink, drawn above the appliance</div>' +
    '<div><span class="swatch" style="border-color:var(--south)"></span>Internal segment, drawn below</div>' +
    '<div><span class="swatch" style="border-color:var(--overlay);border-top-style:dotted"></span>VPN tunnel between appliances</div>' +
    '<div><span class="swatch" style="border-color:var(--ink-soft);border-top-style:dashed"></span>Inferred, not read directly</div>' +
    '<div><span style="display:inline-block;width:1.7rem;text-align:center;margin-right:0.4rem">&#9679;</span>The root: every uplink ends here</div>' +
    '<div><span style="display:inline-block;width:1.7rem;text-align:center;margin-right:0.4rem;color:var(--alert)">&#9679;</span>Carries a caveat &mdash; click it</div>';
  s.append(l);
  f.append(s);

  const m = h("section");
  m.append(h("h3", null, "Underlay / Overlay"));
  m.append(h("p", null,
    "Underlay is the physical fabric: WAN uplinks, clouds and the outer world, " +
    "with the VPN mesh as optional overlay detail. Overlay hides that WAN " +
    "plumbing and treats the VPN tunnels between appliances as the primary " +
    "connections — what the fleet looks like from inside the mesh."));
  f.append(m);

  if (DOC) {
    const d = h("section");
    d.append(h("h3", null, "Sources"));
    for (const dev of DOC.devices || []) {
      const row = h("div", "iface");
      row.append(h("span", "n", dev.label));
      row.append(document.createTextNode(" "));
      row.append(h("span", "tag", dev.source));
      if (dev.error) row.append(h("div", "a", dev.error));
      const missing = Object.keys(dev.partial || {});
      if (missing.length) row.append(h("div", "z", "not read: " + missing.join(", ").replace(/\.json/g, "")));
      d.append(row);
    }
    f.append(d);
  }
  return f;
}

function facts(pairs) {
  const dl = h("dl", "facts");
  for (const [k, v] of pairs) {
    if (v === undefined || v === null || v === "") continue;
    dl.append(h("dt", null, k), h("dd", null, String(v)));
  }
  return dl;
}

// activeTab remembers the last tab id chosen, across selections: browsing
// several segments in a row to compare, say, their address objects should
// not reset to "Information" on every click.
let activeTab = null;

// tabs renders a tab bar plus one panel per section, all built up front
// (build() runs immediately, not lazily) since the underlying data is a
// small in-memory object, not worth deferring. Only one panel is visible at
// a time; switching tabs never touches node/edge selection state.
function tabs(sections) {
  const wrap = document.createDocumentFragment();
  const bar = h("div", "tabbar");
  const built = sections.map(s => ({ ...s, panel: h("div", "tabpanel") }));
  for (const s of built) s.panel.append(s.build());

  const initial = built.some(s => s.id === activeTab) ? activeTab : built[0].id;
  for (const s of built) {
    const btn = h("button", "tab-btn", s.label);
    btn.type = "button";
    btn.setAttribute("aria-selected", String(s.id === initial));
    s.panel.hidden = s.id !== initial;
    btn.addEventListener("click", () => {
      activeTab = s.id;
      bar.querySelectorAll(".tab-btn").forEach(b => b.setAttribute("aria-selected", "false"));
      btn.setAttribute("aria-selected", "true");
      for (const other of built) other.panel.hidden = other.id !== s.id;
    });
    bar.append(btn);
  }
  wrap.append(bar, ...built.map(s => s.panel));
  return wrap;
}

function nodePanel(n, touching) {
  const f = document.createDocumentFragment();
  f.append(h("h2", null, n.label || n.id));
  const kindText = {
    device: "Appliance", segment: "Network segment",
    cloud: "Upstream", gateway: "Inferred router", world: "Everything past the uplinks"
  }[n.kind] || n.kind;
  f.append(h("p", "kind", kindText + (n.orientation ? " · " + n.orientation : "")));

  const buildInformation = () => {
    const frag = document.createDocumentFragment();
    const s1 = h("section");
    s1.append(facts([
      ["Serial", n.serial],
      ["Hostname", n.hostname],
      ["Prefix", n.cidr],
      ["Gateway IP", n.gatewayIp],
      ["HA peers", (n.haPeers || []).join(", ")],
      ["Links", touching.length]
    ]));
    frag.append(s1);

    for (const w of n.warnings || []) {
      frag.append(h("div", "warn", w));
    }

    if (n.kind === "device" && n.interfaces && n.interfaces.length) {
      const s = h("section");
      s.append(h("h3", null, "Interfaces"));
      for (const i of n.interfaces) {
        const row = h("div", "iface");
        const line = h("div");
        line.append(h("span", "n", i.name));
        if (i.addr) { line.append(document.createTextNode(" ")); line.append(h("span", "a", i.addr)); }
        row.append(line);
        const sub = h("div", "z");
        sub.textContent = `${i.zoneName} (${i.zoneType}) · ${i.orientation}`;
        row.append(sub);
        if (i.gatewayName) row.append(h("div", "a", "via " + i.gatewayName + " " + (i.gatewayIp || "")));
        const tags = h("div");
        if (i.isApiPath) { tags.append(h("span", "tag", "collector path")); tags.append(document.createTextNode(" ")); }
        if (i.type && i.type !== "physical") tags.append(h("span", "tag", i.type));
        if (i.memberOf) { tags.append(document.createTextNode(" ")); tags.append(h("span", "tag", "in " + i.memberOf)); }
        if (!i.enabled) { tags.append(document.createTextNode(" ")); tags.append(h("span", "tag", "disabled")); }
        if (tags.childNodes.length) row.append(tags);
        s.append(row);
      }
      frag.append(s);
    }

    // A network's own interfaces: one row per appliance that has a wire on
    // it, pulled from the device->segment edges rather than re-deriving
    // membership in the browser, so this always agrees with why the segment
    // merged.
    if (n.kind === "segment") {
      const memberEdges = touching.filter(e => e.from !== n.id
        && DOC.graph.nodes.find(x => x.id === e.from)?.kind === "device");
      if (memberEdges.length) {
        const s = h("section");
        s.append(h("h3", null, "Connected interfaces"));
        for (const e of memberEdges) {
          const dev = DOC.graph.nodes.find(x => x.id === e.from);
          const iface = (dev.interfaces || []).find(i => i.name === e.label);
          const row = h("div", "iface");
          const line = h("div");
          line.append(h("span", "n", dev.label || dev.id));
          line.append(document.createTextNode(" — " + (e.label || "")));
          row.append(line);
          if (iface) {
            const sub = h("div", "z");
            sub.textContent = `${iface.zoneName} (${iface.zoneType})` + (iface.addr ? " · " + iface.addr : "");
            row.append(sub);
          }
          s.append(row);
        }
        frag.append(s);
      }
    }
    return frag;
  };

  const buildAddressObjects = () => {
    const frag = document.createDocumentFragment();
    const s = h("section");
    if (n.addressObjects && n.addressObjects.length) {
      for (const o of n.addressObjects) {
        const row = h("div", "iface");
        const line = h("div");
        line.append(h("span", "n", o.name));
        line.append(document.createTextNode(" "));
        line.append(h("span", "tag", o.hostType));
        if (o.multipleFirewalls) {
          line.append(document.createTextNode(" "));
          line.append(h("span", "tag alert", "multiple-firewalls"));
        }
        row.append(line);
        const sub = h("div", "z");
        sub.textContent = `${o.value} · ${o.deviceLabel}`;
        row.append(sub);
        s.append(row);
      }
    } else {
      s.append(h("p", null, "No address objects match this network."));
    }
    frag.append(s);
    return frag;
  };

  const buildEvidence = () => {
    const frag = document.createDocumentFragment();
    const s = h("section");
    for (const e of touching) {
      for (const ev of e.evidence || []) {
        const b = h("div", "evidence");
        b.append(h("div", "rule", ev.rule + " · " + e.confidence));
        b.append(h("div", "detail", ev.detail));
        s.append(b);
      }
    }
    frag.append(s);
    return frag;
  };

  const sections = [{ id: "info", label: "Information", build: buildInformation }];
  if (n.kind === "segment") sections.push({ id: "objects", label: "Address objects", build: buildAddressObjects });
  if (touching.length) sections.push({ id: "evidence", label: "Evidences", build: buildEvidence });
  f.append(tabs(sections));
  return f;
}

function edgePanel(e) {
  const f = document.createDocumentFragment();
  f.append(h("h2", null, e.label || e.from + " → " + e.to));
  f.append(h("p", "kind", e.orientation + " · " + e.confidence));

  const buildInformation = () => {
    const frag = document.createDocumentFragment();
    const s1 = h("section");
    s1.append(facts([["From", e.from], ["To", e.to]]));
    frag.append(s1);
    return frag;
  };

  const buildEvidence = () => {
    const frag = document.createDocumentFragment();
    const s = h("section");
    if (!(e.evidence || []).length) {
      s.append(h("p", null, "No rule recorded for this link."));
    }
    for (const ev of e.evidence || []) {
      const b = h("div", "evidence");
      b.append(h("div", "rule", ev.rule));
      b.append(h("div", "detail", ev.detail));
      s.append(b);
    }
    frag.append(s);
    return frag;
  };

  f.append(tabs([
    { id: "info", label: "Information", build: buildInformation },
    { id: "evidence", label: "Evidences", build: buildEvidence }
  ]));
  return f;
}

/* ---------- loading ---------- */

function loadDoc(raw) {
  let parsed;
  try { parsed = typeof raw === "string" ? JSON.parse(raw) : raw; }
  catch (err) { showError("That file is not valid JSON."); return; }

  const graph = parsed.graph || parsed;
  if (!graph || !Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) {
    showError("No nodes and edges in that file. Expected the output of sfos-topology.");
    return;
  }
  DOC = { graph, devices: parsed.devices || [], generatedAt: parsed.generatedAt };
  selection = null;

  const devs = DOC.devices.length ? DOC.devices.length + " appliances" : "";
  const when = DOC.generatedAt ? new Date(DOC.generatedAt).toLocaleString() : "";
  meta.textContent = [devs, graph.nodes.length + " nodes", graph.edges.length + " links", when]
    .filter(Boolean).join("  ·  ");
  render();
}

function showError(msg) {
  panel.replaceChildren();
  panel.append(h("h2", null, "Could not read that file"));
  panel.append(h("p", "kind", msg));
}

document.getElementById("file").addEventListener("change", ev => {
  const file = ev.target.files[0];
  if (file) file.text().then(loadDoc);
});

["dragenter", "dragover"].forEach(t =>
  document.addEventListener(t, ev => { ev.preventDefault(); canvas.classList.add("is-over"); }));
["dragleave", "drop"].forEach(t =>
  document.addEventListener(t, ev => { ev.preventDefault(); canvas.classList.remove("is-over"); }));
document.addEventListener("drop", ev => {
  const file = ev.dataTransfer.files[0];
  if (file) file.text().then(loadDoc);
});

for (const id of ["t-overlay", "t-mgmt", "t-ghost"]) {
  document.getElementById(id).addEventListener("change", render);
}
document.getElementById("mode-underlay").addEventListener("click", () => setMode("underlay"));
document.getElementById("mode-overlay").addEventListener("click", () => setMode("overlay"));
document.getElementById("fit").addEventListener("click", () => fit(extent));

document.getElementById("export").addEventListener("click", () => {
  if (!DOC) return;
  const clone = stage.cloneNode(true);
  clone.setAttribute("viewBox",
    `${extent.x - 40} ${extent.y - 40} ${extent.width + 80} ${extent.height + 80}`);
  clone.setAttribute("width", extent.width + 80);
  clone.setAttribute("height", extent.height + 80);
  clone.querySelector("g").removeAttribute("transform");
  clone.querySelectorAll(".dim, .sel").forEach(n => n.classList.remove("dim", "sel"));
  // Inline the stylesheet: an exported file has no document to inherit from.
  const style = document.createElementNS(NS, "style");
  style.textContent = document.querySelector("style").textContent;
  clone.prepend(style);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n', clone.outerHTML],
                        { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "topology.svg";
  a.click();
  URL.revokeObjectURL(a.href);
});

window.addEventListener("resize", () => { if (DOC) fit(extent); });

/* ------------------------------------------------------------------ *
 * Settings: add, edit and remove firewalls.
 *
 * This talks to /api/devices, which only exists when the collector was
 * started with SFOS_ADMIN_TOKEN set -- deliberately opt-in, since a write
 * endpoint that can plant firewall API keys is a bigger blast radius than
 * the read-only graph this page otherwise only ever shows. The token is
 * kept in sessionStorage: enough to avoid retyping it on every click within
 * one tab, gone the moment the tab closes.
 * ------------------------------------------------------------------ */

const backdrop     = document.getElementById("settings-backdrop");
const settingsBody = document.getElementById("settings-body");
let adminToken   = sessionStorage.getItem("sfos-admin-token") || "";
let editingLabel = null;  // non-null while the form is editing an existing device
let lastDevices  = [];

function openSettings() { backdrop.hidden = false; renderSettings(); }
function closeSettings() { backdrop.hidden = true; editingLabel = null; }

document.getElementById("settings-btn").addEventListener("click", openSettings);
document.getElementById("settings-close").addEventListener("click", closeSettings);
backdrop.addEventListener("click", ev => { if (ev.target === backdrop) closeSettings(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !backdrop.hidden) closeSettings(); });

async function apiFetch(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers, { "X-Admin-Token": adminToken });
  if (opts.body) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(path, Object.assign({}, opts, { headers }));
  } catch (err) {
    return { ok: false, status: 0, body: { error: "could not reach the server" } };
  }
  let body = null;
  try { body = await res.json(); } catch (err) { /* no/invalid body */ }
  return { ok: res.ok, status: res.status, body };
}

async function refetchGraph() {
  try {
    const r = await fetch("graph.json", { cache: "no-store" });
    if (r.ok) loadDoc(await r.json());
  } catch (err) { /* leave the current graph on screen */ }
}

function renderSettings() {
  settingsBody.replaceChildren(h("p", null, "Loading…"));
  if (!adminToken) { settingsBody.replaceChildren(tokenPrompt()); return; }
  apiFetch("api/devices").then(({ ok, status, body }) => {
    if (status === 404) { settingsBody.replaceChildren(disabledNotice()); return; }
    if (status === 401) {
      adminToken = "";
      sessionStorage.removeItem("sfos-admin-token");
      settingsBody.replaceChildren(tokenPrompt("That token was rejected."));
      return;
    }
    if (!ok) { settingsBody.replaceChildren(msgPanel("error", (body && body.error) || `HTTP ${status}`)); return; }
    lastDevices = body || [];
    editingLabel = null;
    renderDevicesAndForm();
  });
}

function renderDevicesAndForm(message) {
  settingsBody.replaceChildren(buildDevicesAndForm(lastDevices, message));
}

function tokenPrompt(message) {
  const f = document.createDocumentFragment();
  if (message) f.append(h("div", "settings-error", message));
  f.append(h("p", "hint",
    "Settings needs the admin token the server was started with " +
    "(the SFOS_ADMIN_TOKEN environment variable)."));
  const field = h("div", "field");
  const lab = h("label", null, "Admin token");
  field.append(lab);
  const input = document.createElement("input");
  input.type = "password";
  input.placeholder = "••••••••";
  field.append(input);
  f.append(field);
  const actions = h("div", "form-actions");
  const go = h("button", "primary", "Continue");
  go.type = "button";
  go.addEventListener("click", () => {
    const v = input.value.trim();
    if (!v) return;
    adminToken = v;
    sessionStorage.setItem("sfos-admin-token", adminToken);
    renderSettings();
  });
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") go.click(); });
  actions.append(go);
  f.append(actions);
  return f;
}

function disabledNotice() {
  const f = document.createDocumentFragment();
  f.append(h("p", "hint",
    "Settings are disabled on this server. Set SFOS_ADMIN_TOKEN in its " +
    "environment and restart the collector to enable adding, editing and " +
    "removing firewalls from here."));
  return f;
}

function msgPanel(kind, text) {
  const f = document.createDocumentFragment();
  f.append(h("div", kind === "error" ? "settings-error" : "settings-note", text));
  return f;
}

function field(labelText, id, type, value, placeholder) {
  const wrap = h("div", "field");
  const lab = h("label", null, labelText);
  lab.htmlFor = id;
  wrap.append(lab);
  const input = document.createElement("input");
  input.type = type; input.id = id;
  if (value !== undefined && value !== null) input.value = value;
  if (placeholder) input.placeholder = placeholder;
  wrap.append(input);
  return wrap;
}

function buildDevicesAndForm(devices, message) {
  const f = document.createDocumentFragment();
  if (message) f.append(h("div", message.kind === "error" ? "settings-error" : "settings-note", message.text));

  const list = h("section");
  list.append(h("h3", null, "Firewalls"));
  if (!devices.length) list.append(h("p", "hint", "No firewalls configured yet."));
  for (const d of devices) {
    const row = h("div", "device-row");
    const info = h("div");
    info.append(h("div", "label", d.label));
    info.append(h("div", "host", d.offlineDir ? "replay: " + d.offlineDir : (d.host || "")));
    const tags = h("div");
    tags.append(h("span", "tag", d.hasToken ? "key set" : "no key"));
    if (d.tokenEnv) { tags.append(document.createTextNode(" ")); tags.append(h("span", "tag", "env: " + d.tokenEnv)); }
    if (d.pinSha256) { tags.append(document.createTextNode(" ")); tags.append(h("span", "tag", "pinned")); }
    info.append(tags);
    row.append(info);

    const actions = h("div", "row-actions");
    const editBtn = h("button", null, "Edit");
    editBtn.type = "button";
    editBtn.addEventListener("click", () => { editingLabel = d.label; renderDevicesAndForm(); });
    const delBtn = h("button", null, "Remove");
    delBtn.type = "button";
    delBtn.addEventListener("click", () => {
      if (!confirm(`Remove ${d.label}? This deletes it from devices.json and its stored key.`)) return;
      apiFetch("api/devices/" + encodeURIComponent(d.label), { method: "DELETE" }).then(({ ok, status, body }) => {
        if (!ok) { renderDevicesAndForm({ kind: "error", text: (body && body.error) || `HTTP ${status}` }); return; }
        lastDevices = (body && body.devices) || [];
        editingLabel = null;
        renderDevicesAndForm({ kind: "note", text: `Removed ${d.label}.` });
        refetchGraph();
      });
    });
    actions.append(editBtn, delBtn);
    row.append(actions);
    list.append(row);
  }
  f.append(list);

  const editing = devices.find(d => d.label === editingLabel) || null;
  const formSection = h("section");
  formSection.append(h("h3", null, editing ? `Edit ${editing.label}` : "Add a firewall"));

  formSection.append(field("Label", "df-label", "text", editing ? editing.label : "", "FW-101"));
  formSection.append(field("Host (address:port)", "df-host", "text", editing ? editing.host : "", "192.168.101.99:4444"));
  formSection.append(field("API key", "df-token", "password", "",
    editing ? "leave blank to keep the current key" : "sfos_..."));
  formSection.append(field("Certificate pin (SHA-256, optional)", "df-pin", "text", editing ? editing.pinSha256 : "", ""));

  const actions = h("div", "form-actions");
  const save = h("button", "primary", editing ? "Save changes" : "Add firewall");
  save.type = "button";
  save.addEventListener("click", () => {
    const label = document.getElementById("df-label").value.trim();
    const host = document.getElementById("df-host").value.trim();
    const token = document.getElementById("df-token").value;
    const pin = document.getElementById("df-pin").value.trim();
    if (!label || !host) { renderDevicesAndForm({ kind: "error", text: "Label and host are required." }); return; }

    const payload = { label, host, token, pinSha256: pin };
    save.disabled = true;
    const req = editing
      ? apiFetch("api/devices/" + encodeURIComponent(editing.label), { method: "PUT", body: JSON.stringify(payload) })
      : apiFetch("api/devices", { method: "POST", body: JSON.stringify(payload) });
    req.then(({ ok, status, body }) => {
      if (!ok) { renderDevicesAndForm({ kind: "error", text: (body && body.error) || `HTTP ${status}` }); return; }
      lastDevices = (body && body.devices) || [];
      editingLabel = null;
      let text = editing ? `Saved ${label}.` : `Added ${label}.`;
      if (body && body.device && body.device.error) text += " Could not connect yet: " + body.device.error;
      renderDevicesAndForm({ kind: body && body.device && body.device.error ? "error" : "note", text });
      refetchGraph();
    });
  });
  actions.append(save);
  if (editing) {
    const cancel = h("button", null, "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", () => { editingLabel = null; renderDevicesAndForm(); });
    actions.append(cancel);
  }
  formSection.append(actions);
  f.append(formSection);
  return f;
}
