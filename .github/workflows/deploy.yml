name: Build, publish and deploy

# paths-ignore on k8s/app/** is what stops this workflow from re-triggering
# itself: the only thing it ever writes back to the repo is the image tag
# inside k8s/app/deployment.yaml, committed with [skip ci] as a second,
# belt-and-suspenders guard against a loop.
on:
  push:
    branches: [master]
    paths-ignore:
      - "k8s/app/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # ArgoCD syncs on git state, not registry state -- a new :latest image
      # alone leaves nothing for it to notice. Bumping the manifest's image
      # tag is the commit that actually triggers the rollout.
      - name: Point the deployment at the new image
        run: |
          sed -i "s#image: ghcr.io/${{ github.repository }}:.*#image: ghcr.io/${{ github.repository }}:${{ github.sha }}#" k8s/app/deployment.yaml

      - name: Commit the new image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/deployment.yaml
          git diff --cached --quiet || git commit -m "deploy: ghcr.io/${{ github.repository }}:${{ github.sha }} [skip ci]"
          git push
