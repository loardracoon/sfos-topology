# ClusterIP: the Ingress (k8s/app/ingress.yaml) is what actually exposes
# this externally at topology.sophizo.com.br, by explicit choice -- see that
# file's comment and k8s/README.md for the trade-off (the viewer has no
# authentication of its own).
apiVersion: v1
kind: Service
metadata:
  name: sfos-topology
  namespace: sfos-topology
spec:
  selector:
    app: sfos-topology
  ports:
    - name: http
      port: 8089
      targetPort: http
  type: ClusterIP
